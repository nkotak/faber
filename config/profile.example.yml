# Faber Profile Configuration
# Copy this file to config/profile.yml and fill in your details.
# This is the single source of truth for your personal data across all modes.

candidate:
  full_name: "Jane Smith"
  email: "jane@example.com"
  phone: "+1-555-0123"
  location: "San Francisco, CA"
  linkedin: "linkedin.com/in/janesmith"
  portfolio_url: "https://janesmith.dev"
  github: "github.com/janesmith"
  twitter: "https://x.com/janesmith"
  # (Optional) Canva resume design ID for visual CV generation via /faber pdf.
  # Find it in your Canva design URL: https://www.canva.com/design/DAxxxxxxx/...
  # The ID starts with "D" and is 11 characters long.
  # canva_resume_design_id: "DAxxxxxxxxx"

target_roles:
  # Your North Star roles — what you're optimizing for
  primary:
    - "Senior AI Engineer"
    - "Staff ML Engineer"
  # Archetypes help the evaluation system score fit
  archetypes:
    - name: "AI/ML Engineer"
      level: "Senior/Staff"
      fit: "primary"        # primary = dream role, secondary = good fit, adjacent = stretch
    - name: "AI Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "Solutions Architect"
      level: "Mid-Senior"
      fit: "adjacent"

narrative:
  # Your professional headline (1 line)
  headline: "ML Engineer turned AI product builder"
  # Your exit story — what makes you unique
  exit_story: "Built and sold my SaaS after 5 years. Now focused on applied AI at scale."
  # Your top 3-5 superpowers
  superpowers:
    - "End-to-end ML pipelines"
    - "Fast prototyping (idea to prod in 2 weeks)"
    - "Cross-functional communication"
  # Proof points — projects, articles, case studies with measurable impact
  proof_points:
    - name: "Project Alpha"
      url: "https://janesmith.dev/project-alpha"
      hero_metric: "Reduced inference latency 40%"
    - name: "Open Source Tool"
      url: "https://github.com/janesmith/tool"
      hero_metric: "2K+ GitHub stars"
  # Optional: dashboard/demo URL with credentials
  # dashboard:
  #   url: "https://janesmith.dev/demo"
  #   password: "demo-2026"

compensation:
  target_range: "$150K-200K"     # Your target total comp
  currency: "USD"
  minimum: "$120K"               # Walk-away number
  location_flexibility: "Remote preferred, 1 week/month on-site possible"

location:
  country: "United States"
  city: "San Francisco"
  timezone: "PST"
  visa_status: "No sponsorship needed"
  # For remote roles outside your country:
  # onsite_availability: "1 week/month in any city"

# -- Location filter (optional, default off) --
# When enabled, /faber scan rejects jobs whose location doesn't match. Default
# behavior with this block missing or `enabled: false`: every job passes the
# filter, identical to the previous behavior.
#
# Filter is strictly subtractive: it can only reject. Scoring still happens at
# evaluation time per modes/_profile.md location tiers.
#
# Location strings are normalized via config/location-aliases.json + your
# custom_aliases below (e.g., "NYC" matches "New York City", "Manhattan",
# "Brooklyn", etc.). Multi-location postings ("San Francisco | NYC | Remote")
# pass if ANY piece matches an allow rule.
#
# Uncomment and customize:
#
# location_filter:
#   enabled: true
#   remote:
#     enabled: true                  # accept "Remote" jobs at all?
#     accept_regions:
#       - "us"                       # allow "Remote — US" / "Remote, US"
#       - "americas"                 # allow "Remote — Americas"
#       - "global"                   # allow "Remote — Worldwide"
#     bare_remote_policy: "allow"    # allow|deny|unknown — what to do with bare "Remote"
#   hybrid:
#     locations:
#       - "NYC"                      # auto-aliased: New York City, Manhattan, Brooklyn...
#       - "NJ"                       # auto-aliased: New Jersey, Jersey City, Newark...
#   onsite:
#     locations: []                  # empty = no on-site jobs accepted
#   custom_aliases:
#     # Add your own canonical-name → variant mappings. Merged on top of
#     # config/location-aliases.json. Useful when you want a custom region
#     # like "Tri-State" to map to a specific city set.
#     # "Tri-State":
#     #   - "New York"
#     #   - "Newark"
#     #   - "Stamford"
#   unknown_policy: "ask"            # allow|deny|ask — for empty/unparseable location strings
