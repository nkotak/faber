<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: Georgia, 'Times New Roman', Cambria, serif;
    font-size: 9.5pt;
    line-height: 1.25;
    color: #000;
    background: #fff;
  }

  .page {
    max-width: 100%;
    padding: 0;
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 8px;
  }

  .header h1 {
    font-size: 19pt;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 2px;
    line-height: 1.05;
    color: #000;
  }

  .contact-line {
    font-size: 9pt;
    color: #000;
    line-height: 1.3;
  }

  .contact-line a {
    color: #1a5490;
    text-decoration: none;
  }

  .contact-line .sep {
    color: #666;
    margin: 0 3px;
  }

  /* === SECTIONS === */
  .section {
    margin-top: 6px;
    margin-bottom: 2px;
  }

  .section-title {
    font-size: 11pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #000;
    border-bottom: 0.8px solid #333;
    padding-bottom: 1px;
    margin-bottom: 4px;
  }

  /* === EXPERIENCE === */
  .job {
    margin-bottom: 5px;
    page-break-inside: avoid;
  }

  .job-header {
    font-size: 9.5pt;
    font-weight: 700;
    color: #000;
    margin-bottom: 1px;
    line-height: 1.2;
  }

  .job-header .sep {
    color: #444;
    margin: 0 3px;
    font-weight: 400;
  }

  .job ul {
    list-style: none;
    padding-left: 0;
    margin-top: 1px;
  }

  .job li {
    position: relative;
    padding-left: 11px;
    margin-bottom: 1px;
    font-size: 9.5pt;
    line-height: 1.25;
    color: #000;
  }

  .job li::before {
    content: "•";
    position: absolute;
    left: 2px;
    top: 0;
    color: #000;
  }

  .job li strong {
    font-weight: 700;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 2px;
    font-size: 9.5pt;
    line-height: 1.25;
  }

  .edu-item .edu-degree {
    font-weight: 700;
  }

  .edu-item .sep {
    color: #444;
    margin: 0 3px;
    font-weight: 400;
  }

  /* === SKILLS === */
  .skills-block {
    font-size: 9.5pt;
    line-height: 1.3;
  }

  .skills-block .skill-category {
    margin-bottom: 1px;
  }

  .skills-block .skill-label {
    font-weight: 700;
  }

  .skills-block .skill-list strong {
    font-weight: 700;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="contact-line">{{CONTACT_LINE}}</div>
  </div>

  <div class="section">
    <div class="section-title">Experience</div>
    {{EXPERIENCE_HTML}}
  </div>

  <div class="section">
    <div class="section-title">Education</div>
    {{EDUCATION_HTML}}
  </div>

  <div class="section">
    <div class="section-title">Skills</div>
    <div class="skills-block">{{SKILLS_HTML}}</div>
  </div>

</div>
</body>
</html>
