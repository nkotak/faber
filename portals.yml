# Portal Scanner Configuration
# Used by /faber scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. APIs → Ashby, Lever, Greenhouse JSON APIs (real-time, structured, reliable)
#   2. agent-browser CLI → custom careers pages (headless Chrome via CLI)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# Each tracked company has a `platform` field:
#   ashby      → API: api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true
#   lever      → API: api.lever.co/v0/postings/{slug}
#   greenhouse → API: boards-api.greenhouse.io/v1/boards/{slug}/jobs
#   workable   → Browser: agent-browser (no public API)
#   custom     → Browser: agent-browser
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Core PM titles --
    - "Product Manager"
    - "Technical PM"
    - "Technical Product Manager"
    - "Group Product Manager"
    - "Product Lead"
    - "Principal Product Lead"
    - "Principal Product Manager"
    # -- AI/ML PM titles --
    - "AI Product Manager"
    - "ML Product Manager"
    - "AI PM"
    - "Product Manager AI"
    - "Product Manager ML"
    - "Product Manager, Research"
    - "Product Manager, AI"
    - "Product Manager, Platform"
    - "Product Manager, SDK"
    - "Product Manager, Developer"
    - "Product Manager, Infrastructure"
    - "Product Manager, GenAI"
    - "Product Manager, Generative AI"
    - "Applied AI Product Manager"
    - "Product Manager, Applied AI"
    # -- AI-adjacent leadership --
    - "AI"
    - "ML"
    - "LLM"
    - "GenAI"
    - "Generative AI"
    - "Agentic"
    - "Agent"
  negative:
    - "Junior"
    - "Intern"
    - "Associate Product Manager"
    - "APM"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Customer Engineer"
    - "DevRel"
    - "Developer Advocate"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "Group"

# -- Search queries --
search_queries:

  # -- Ashby --
  - name: Ashby — Staff/Principal PM AI
    query: 'site:jobs.ashbyhq.com "Staff Product Manager" OR "Principal Product Manager" OR "Senior Product Manager" AI remote'
    enabled: true

  - name: Ashby — PM Platform/Infra
    query: 'site:jobs.ashbyhq.com "Product Manager" "platform" OR "infrastructure" OR "messaging" OR "notifications" OR "SDK" remote'
    enabled: true

  - name: Ashby — PM GenAI/Agentic
    query: 'site:jobs.ashbyhq.com "Product Manager" "GenAI" OR "generative AI" OR "agentic" OR "LLM" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Staff/Principal PM AI
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Staff Product Manager" OR "Principal Product Manager" AI remote'
    enabled: true

  - name: Greenhouse — Senior PM AI/ML
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Senior Product Manager" AI OR ML OR "generative" remote'
    enabled: true

  - name: Greenhouse — PM Platform/Messaging
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Product Manager" "platform" OR "messaging" OR "notifications" OR "developer" remote'
    enabled: true

  # -- Lever --
  - name: Lever — Staff/Principal PM
    query: 'site:jobs.lever.co "Staff Product Manager" OR "Principal Product Manager" OR "Group Product Manager" AI remote'
    enabled: true

  - name: Lever — Senior PM AI
    query: 'site:jobs.lever.co "Senior Product Manager" AI OR ML OR "generative" OR "agentic" remote'
    enabled: true

  # -- Wellfound (startups) --
  - name: Wellfound — AI PM
    query: 'site:wellfound.com "Product Manager" AI OR ML "staff" OR "principal" OR "senior" remote'
    enabled: true

  # -- Workable --
  - name: Workable — PM AI
    query: 'site:apply.workable.com "Product Manager" AI OR ML OR "generative" remote'
    enabled: true

  # -- YC / Startup boards --
  - name: YC Jobs — Staff/Principal PM
    query: 'site:workatastartup.com "Product Manager" AI OR ML "staff" OR "principal" OR "senior" remote'
    enabled: true

  # -- Big Tech direct --
  - name: Google — PM AI
    query: 'site:careers.google.com "Product Manager" AI OR ML OR "generative"'
    enabled: true

  - name: Meta — PM AI
    query: 'site:metacareers.com "Product Manager" AI OR ML OR "generative"'
    enabled: true

  - name: Apple — PM AI
    query: 'site:jobs.apple.com "Product Manager" AI OR ML OR "machine learning"'
    enabled: true

  - name: Microsoft — PM AI
    query: 'site:careers.microsoft.com "Product Manager" AI OR "Copilot" OR "generative" OR ML'
    enabled: true

  - name: Amazon — PM AI
    query: 'site:amazon.jobs "Product Manager" AI OR ML OR "generative" OR "Alexa" OR "Bedrock"'
    enabled: true

  # -- Media & Entertainment --
  - name: Disney — PM
    query: 'site:jobs.disneycareers.com "Product Manager" OR "Technical Product Manager"'
    enabled: true

  - name: Netflix — PM
    query: 'site:explore.jobs.netflix.net "Product Manager" OR "Technical PM"'
    enabled: true

  - name: NBC Universal — PM
    query: 'site:nbcunicareers.com/find-a-job "Product Manager" AI OR "platform" OR "Peacock"'
    enabled: true

  - name: CNN / Warner Bros Discovery — PM
    query: '"Warner Bros Discovery" OR "CNN" "Product Manager" AI OR "platform" OR "messaging" site:wbd.com OR site:careers.wbd.com'
    enabled: true

  # -- Sports --
  - name: MLB — PM
    query: 'site:mlb.com/careers/opportunities "Product Manager"'
    enabled: true

  - name: NFL — PM
    query: '"NFL" "Product Manager" site:nfl.com OR site:careers.nfl.com'
    enabled: true

  - name: NBA — PM
    query: '"NBA" "Product Manager" site:nba.com OR site:careers.nba.com'
    enabled: true

  - name: Fanatics — PM
    query: 'site:jobs.lever.co/fanatics OR "fanatics" "Product Manager" AI OR "platform"'
    enabled: true

  - name: Yankees — PM
    query: '"New York Yankees" OR "yankees" "Product Manager" OR "technology"'
    enabled: true

  # -- General aggregators (US) --
  - name: HN Who's Hiring — PM AI
    query: 'site:news.ycombinator.com "Product Manager" AI OR ML "staff" OR "principal" OR "senior" remote'
    enabled: true

  - name: RemoteOK — PM AI
    query: 'site:remoteok.com "Product Manager" AI OR ML OR "generative"'
    enabled: true


